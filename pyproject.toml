[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["assets", "backups", "data", "logs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
]

[tool.ruff.lint.per-file-ignores]
# PsychoPy preferences (audioLib, SDL_AUDIODRIVER) must be set before the
# rest of psychopy is imported, so these entry points import out of order
# on purpose.
"main.py" = ["E402"]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["src", "main.py", "admin.py", "tests"]
# PsychoPy, ffpyplayer and PySide6 ship no usable stubs.
ignore_missing_imports = true
# Adım 0 baseline: type errors are reported but the pre-existing code is not
# yet fully annotated.  Adım 1 tightens this (disallow_untyped_defs etc.)
# once the new mcgurk/ package replaces src/.
warn_unused_ignores = true
warn_redundant_casts = true
