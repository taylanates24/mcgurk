[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "psychopy: PsychoPy (ekran/ses aygıtı) gerektiren testler; CI'da atlanır",
    "ffmpeg: ffmpeg ikilisi gerektiren testler; ikili yoksa atlanır",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["assets", "backups", "data", "logs", "stimuli", "legacy"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
]

[tool.ruff.lint.per-file-ignores]
# PsychoPy preferences (audioLib, SDL_AUDIODRIVER) must be set before the
# rest of psychopy is imported, so these entry points import out of order
# on purpose.
"main.py" = ["E402"]
"scripts/*.py" = ["E402"]
# tools/ scripts put the project root on sys.path before importing mcgurk.
"tools/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["mcgurk", "tools", "main.py", "tests"]
# The Adım 0 baseline is frozen under legacy/ and neither checked nor run.
exclude = ["^legacy/"]
plugins = ["pydantic.mypy"]
# Derive module names from the repository root so tests/conftest.py and
# tests/mcgurk/conftest.py are distinct modules.  pytest needs both to be
# named conftest.py and neither directory can carry __init__.py: a package
# named `tests.mcgurk` would shadow the real `mcgurk` package on sys.path.
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
# PsychoPy, ffpyplayer and PySide6 ship no usable stubs.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

# The whole live codebase is annotated; the Adım 0 baseline that used to be
# exempt here is retired under legacy/ (Adım 8c-ii) and excluded above.
[[tool.mypy.overrides]]
module = ["mcgurk.*", "tools.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true
