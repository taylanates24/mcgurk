# McGurk / SSD platform — single source of truth (steps.md §G).
#
# Validated by mcgurk/config/schema.py.  Unknown fields are an error, so a
# typo cannot silently fall back to a default.
#
# The trial counts below are deliberate MINIMUMS, not a decided design — §F.1
# is still open.  Each is the smallest number that still yields the measure the
# module exists for; going lower stops measuring rather than measuring faster.
# Raising them is a config edit and nothing else.
#
# Run `python -m mcgurk.config` after any change: it prints the resulting trial
# count and duration estimate, which is what the §F.1 decision is made against.
#
# What was NOT reduced, and why:
#   * noise_conditions × ears crossing — this is the SSD hypothesis itself.
#   * modules.gin — a normed clinical test (Musiek et al., 2005); fewer
#     presentations per gap breaks the 4-of-6 threshold rule and with it the
#     published norms.
#   * session.practice_trials — 12 across six modules is already two each.

experiment:
  name: mcgurk_ssd
  version: 1.0.0
  mode: development          # development | data_collection

paths:
  # Prepared stimuli (silent CFR video + 48 kHz PCM WAV) — produced by
  # tools/prepare_stimuli.py in Adım 2.  Raw recordings stay in assets/ and
  # are the legacy src/ tree's input, not this one's.
  stimuli: stimuli/
  data: data/
  logs: logs/
  backups: backups/

logging:
  console_level: INFO        # what the operator sees during a session
  file_level: DEBUG          # what stays on disk for later diagnosis

database:
  # Separate file from the legacy src/ database (data/mcgurk.db); the schemas
  # are incompatible and cannot share one file.
  path: data/mcgurk.sqlite
  backup_on_session_end: true

timing:
  # From the photodiode measurement (01_av_gecikme_olcumu.md).  Null until the
  # code is finished; data_collection mode refuses to start without it.
  system_av_offset_ms: null
  measured_on: null
  audio_latency_mode: 3
  lead_frames: 6
  dropped_frame_tolerance: 1.5

display:
  fullscreen: true
  screen: 0
  size: [1920, 1080]
  background: black
  video_position: [0, 0]     # centre — §A.13, the schema rejects anything else
  expected_refresh_hz: 75

audio:
  sample_rate: 48000
  target_spl_db: 65.0
  # Output of 02_kalibrasyon.md.  Null until calibration is done; required in
  # data_collection mode, where the file must also exist and parse.
  calibration_file: null
  # Exact output device name.  Null lets the operator choose, which is fine in
  # development and refused in data_collection.
  device: "Kulaklıklar (2- WH-1000XM4)"

session:
  module_order: [practice, mcgurk, avsr, tbw, oddball, dichotic, gin]
  break_every_n_trials: 60
  break_duration_s: 30
  practice_trials: 12

# ---- Katılımcıya gösterilen ekran metinleri (§A.9) ----
# Hepsi Türkçe ve config'te: bir yönerge metni protokol ayrıntısıdır ve
# uygulandığı veriyle birlikte sessions.config_snapshot içinde durmalı.
# module_instructions, module_order'daki etkin her ölçüm modülünü kapsamak
# zorundadır — şema yükleme anında kontrol eder ve eksik/fazlasını reddeder.
screens:
  advance_key: space
  continue_hint: "Devam etmek için BOŞLUK tuşuna basın."
  welcome: "Katıldığınız için teşekkürler. Birkaç kısa bölümden oluşan görevler yapacaksınız. Her bölümden önce ne yapmanız gerektiği ekranda açıklanacak. Sorularınızı bölümler arasında sorabilirsiniz."
  practice_intro: "Önce kısa bir alıştırma yapacağız. Alıştırma verisi kaydedilmez; amacı yalnızca göreve alışmanızdır."
  practice_end: "Alıştırma bitti. Sorunuz varsa şimdi sorabilirsiniz. Hazır olduğunuzda asıl test başlayacak."
  break: "Kısa bir ara. Dilerseniz gözlerinizi dinlendirin. Hazır olduğunuzda devam edeceğiz."
  session_end: "Testi tamamladınız. Katıldığınız için çok teşekkür ederiz."
  # ESC'ye basılınca çıkmadan önce sorulur (operatöre). Tuşları metnin kendisi
  # söyler (§A.9): ENTER onaylar, ESC iptal eder.
  quit_confirm: "Oturumdan çıkmak istediğinize emin misiniz?\n\nEvet, çık: ENTER\nİptal, devam et: ESC"
  # Sağır kulağa sunulan basit tespit görevi (§F.3). Kaç ses geleceği ya da
  # hangi kulağa geleceği söylenmez — söylenirse ölçüm bir uyum denetimine döner.
  cross_hearing_intro: "Bu bölümde zaman zaman kısa bir ses duyabilirsiniz. Ne zaman bir ses duyarsanız BOŞLUK tuşuna basın. Emin değilseniz basmayın."
  module_instructions:
    # McGurk: etki katılımcıya ASLA anlatılmaz (talep karakteristiği). Yalnızca
    # "ne duyduğunuzu" sorar; dudak ile sesin uyuşup uyuşmadığından söz etmez.
    mcgurk: "Ekranda konuşan bir yüz göreceksiniz ve aynı anda bir hece duyacaksınız. DUYDUĞUNUZ heceyi ekrandaki seçeneklerden ilgili tuşa basarak seçin. Listede yoksa DİĞER seçeneğini seçip yazabilirsiniz. Kimi denemede gürültü olabilir; en iyi tahmininizi yapın."
    # AVSR: üç sunum modu (yalnız ses / yalnız görüntü / ikisi). Doğru cevabı
    # olan görev; yine de tahmin istenir.
    avsr: "Bu bölümde kimi denemede yalnızca ses, kimi denemede yalnızca görüntü, kimi denemede ikisi birden sunulacak. Size iletilen heceyi ekrandaki tuşlardan seçin. Emin olamasanız da en iyi tahmininizi yapın."
    # TBW: eşzamanlılık yargısı. İki seçenekten hangisinin 'aynı anda' olduğu
    # response_labels'ta tanımlı.
    tbw: "Her denemede bir ses ve bir görüntü sunulacak. Bunların size AYNI ANDA mı yoksa FARKLI ZAMANLARDA mı geldiğini ekrandaki iki seçenekten birini seçerek bildirin."
    # Oddball: dikkat kontrol görevi. Hedefin daha tiz olduğunu söylemek aldatma
    # değil, standart yönergedir.
    oddball: "Art arda tonlar duyacaksınız. Çoğu aynı sestedir; arada daha TİZ (farklı) bir ton duyduğunuzda BOŞLUK tuşuna basın. Yalnızca farklı tonu duyunca basın."
    # Dikotik: serbest rapor (§6.5). İki hece sunulduğu söylenmez, bir kulağa
    # dikkat etmesi istenmez — serbest bildirimin kendisi ölçümdür.
    dichotic: "Kulaklıktan bir hece duyacaksınız. Duyduğunuz heceyi ekrandaki tuşlardan seçin. Listede yoksa DİĞER seçeneğini seçip yazabilirsiniz."
    # GIN: boşluk sayısı ya da süreleri söylenmez.
    gin: "Sürekli bir uğultu (gürültü) duyacaksınız. Bu uğultunun içinde çok kısa bir sessizlik (kesinti) fark ettiğiniz anda BOŞLUK tuşuna basın."

modules:
  # ---- Modül 1: McGurk ----
  mcgurk:
    enabled: true
    speaker_id: 1
    estimated_trial_duration_s: 6.0
    # reps is PER CELL: each pair is presented `reps` times in every
    # noise × ear combination, so `reps: 10` here means 40 presentations.
    # 10 per cell gives 10-point resolution on the fusion rate (binomial SE
    # ~16% at p=0.5); below that the rate estimate stops being usable.
    # The congruent pairs are controls, so 5 is enough.
    av_pairs:
      - {visual: ga, audio: ba, label: fusion_pair,      reps: 10}
      - {visual: ba, audio: ga, label: combination_pair, reps: 10}
      - {visual: ba, audio: ba, label: congruent_ba,     reps: 5}
      - {visual: da, audio: da, label: congruent_da,     reps: 5}
      - {visual: ga, audio: ga, label: congruent_ga,     reps: 5}
    noise_conditions: [null, 5.0]     # null = quiet, number = SNR in dB
    ears: [left, right]
    # BGA/BDA are here because a combination percept has to be expressible;
    # the Adım 0 set (BA/DA/GA only) forced it into "wrong answer".
    response_set: [BA, DA, GA, TA, PA, KA, BGA, BDA, DIGER]
    # Same order as response_set — the schema checks the 1:1 correspondence, so
    # adding a response without a key fails at load rather than at run time.
    response_keys: ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
    free_text_response: DIGER
    response_timeout_s: 5.0
    # Trial structure.  The fixation also absorbs the presenter's per-trial
    # lead, so it is the interval the participant sees, not an extra wait.
    fixation_duration_ms: 1000
    post_response_ms: 300
    prompts:
      question: "Ne duydunuz?"
      other: "Duyduğunuz sesi yazıp Enter'a basın:"
      timeout: "Yanıt alınamadı"
    randomization: block_shuffle
    # Categorisation maps stay out of the code (§A.9).  Keys must name a pair
    # that actually exists in av_pairs and values must be in response_set —
    # the schema checks both.
    fusion_map:
      "ga|ba": [da, ta]
    combination_map:
      "ba|ga": [bga, bda]

  # ---- Modül 2: AVSR ----
  avsr:
    enabled: true
    speaker_id: 1
    estimated_trial_duration_s: 7.0
    stimulus_sets:
      # 3 tokens × 5 reps = 15 trials per A/AV cell — enough for an accuracy
      # figure per cell, since accuracy is pooled across the three tokens.
      - {type: syllable, tokens: [ba, da, ga], reps: 5, enabled: true}
      # Enabled once the word recording session happens (§F.2, Adım 5).
      # No code change is needed — only this flag and a manifest entry.
      - {type: word, list: config/word_lists/tr_pb_50.yaml, reps: 1, enabled: false}
    presentation_modes: [A, V, AV]
    noise_conditions: [null, 5.0]
    ears: [left, right]
    # V-only is NOT crossed with noise and ear: a silent video has no SNR and
    # no side.  The trial count above already reflects that (steps.md §C Adım 5).
    response_mode: closed_set          # closed_set | open_set
    # Forced choice over the three syllables.  No "other" option here, unlike
    # McGurk: this module has a correct answer, and an escape hatch would put
    # trials outside the accuracy figure that the visual benefit index is
    # computed from.
    response_set: [BA, DA, GA]
    response_keys: ["1", "2", "3"]
    free_text_response: null
    response_timeout_s: 6.0
    fixation_duration_ms: 1000
    post_response_ms: 300
    randomization: block_shuffle
    prompts:
      question: "Ne duydunuz?"
      other: "Duyduğunuz sesi yazıp Enter'a basın:"
      timeout: "Yanıt alınamadı"
    # "Ne duydunuz?" is the wrong question when there is no sound.
    mode_questions:
      V: "Ne söyledi?"

  # ---- Modül 3: TBW ----
  tbw:
    enabled: true
    speaker_id: 1
    estimated_trial_duration_s: 5.0
    stimulus: {visual: ba, audio: ba}
    soa_values_ms: [-300, -250, -200, -150, -100, -50, 0, 50, 100, 150, 200, 250, 300]
    # 10 per SOA point is the floor for fitting a Gaussian psychometric
    # function; fewer makes the fit unstable at the tails.  Cut the reps
    # rather than the SOA grid — the grid is what sets the TBW resolution.
    reps_per_soa: 10
    ears: [both]
    tbw_definition: fwhm               # fwhm | sigma1 — written into the report
    # What is on the screen, and in which order.  response_labels says which of
    # the two means "simultaneous"; the schema checks that the two agree.
    response_set: ["Aynı anda", "Farklı zamanda"]
    response_keys: ["1", "2"]
    # No escape hatch here: a third option would drop trials out of the
    # psychometric function, and a two-alternative judgement has no third answer.
    free_text_response: null
    response_labels: {same: "Aynı anda", different: "Farklı zamanda"}
    response_timeout_s: 4.0
    fixation_duration_ms: 1000
    post_response_ms: 300
    randomization: block_shuffle
    prompts:
      question: "Ses ve görüntü aynı anda mıydı?"
      timeout: "Yanıt alınamadı"
    # Confidence intervals for PSS and the window width.  Resampling is seeded
    # from the session seed, so the same data always gives the same interval.
    bootstrap_samples: 2000
    bootstrap_ci: 0.95

  # ---- Modül 4: Oddball ----
  oddball:
    enabled: true
    estimated_trial_duration_s: 1.05
    standard_hz: 1000
    target_hz: 1500
    target_probability: 0.18
    min_standards_between_targets: 2
    # NOT reduced to the minimum, unlike the other modules.  300 × 0.18 = 54
    # targets and ~5.2 min, matching steps.md §C Adım 7.  This is the attention
    # *control* task: if it is underpowered, a group difference in the other
    # modules cannot be separated from a group difference in attention.
    # Cutting it to 200 would have saved 1.7 min of a ~59 min session.
    n_trials: 300
    tone_duration_ms: 50
    tone_ramp_ms: 10
    isi_ms: [900, 1100]
    # One entry only: n_trials is the total, so the ear is not crossed.  Both
    # ears, because this is the attention control task — presenting it to one
    # side would measure a deaf ear's attention in half the SSD sample.
    ears: [both]
    response_key: space
    # Which press counts as a response to which tone, in ms from tone onset.
    # Fixed before data collection on purpose (§F): choosing it afterwards means
    # choosing the hit and false-alarm rates after seeing them.  The lower bound
    # is faster than a real decision to that tone; the upper bound has to stay
    # under the shortest ISI, or a press would belong to two tones at once.
    response_window_ms: [100, 800]
    # Fixation before the first tone.
    lead_in_s: 1.0

  # ---- Modül 5: Dikotik dinleme ----
  # Drafted for the method document as §6.5 (docs/EK_DIKOTIK_DINLEME.docx),
  # awaiting the supervisor — see progress.md, "Kullanıcıya bekleyen aksiyonlar".
  # Stimuli: stimuli/dichotic/speaker_<id>/Left-<l>_Right-<r>.wav (Adım 2).
  dichotic:
    enabled: true
    speaker_id: 1
    estimated_trial_duration_s: 5.0
    pairs:
      - {left: ba, right: da}
      - {left: ba, right: ga}
      - {left: da, right: ba}
      - {left: da, right: ga}
      - {left: ga, right: ba}
      - {left: ga, right: da}
    # 6 pairs × 5 = 30 trials; the ear-advantage index is computed over all 30,
    # not per pair, so 30 observations is the relevant number.
    reps: 5
    response_set: [BA, DA, GA, DIGER]
    response_keys: ["1", "2", "3", "4"]
    free_text_response: DIGER
    response_timeout_s: 5.0
    fixation_duration_ms: 1000
    post_response_ms: 300
    randomization: block_shuffle
    prompts:
      # Free report (§6.5): the participant is never told that two syllables
      # were presented, and is not asked to attend to one ear.  "Hangi heceleri"
      # would give away the competition and turn the measurement into a
      # compliance check.
      question: "Hangi heceyi duydunuz?"
      other: "Duyduğunuz sesi yazıp Enter'a basın:"
      timeout: "Yanıt alınamadı"

  # ---- Modül 6: GIN (Gaps-In-Noise, Musiek ve ark. 2005) ----
  # Not in the reference method document yet — see progress.md.  Noise
  # segments are generated offline (§A.12); that pipeline is Adım 2.
  gin:
    enabled: true
    estimated_trial_duration_s: 8.0
    gap_durations_ms: [2, 3, 4, 5, 6, 8, 10, 12, 15, 20]
    reps_per_gap: 6                    # 10 × 6 = 60 gaps
    segment_duration_s: 6.0
    n_segments: 30                     # 30 × max 3 gaps = capacity 90 ≥ 60
    max_gaps_per_segment: 3
    min_gap_separation_s: 1.0
    inter_segment_interval_s: 2.0
    # GIN is monaural and presenting it to a deaf ear measures nothing, so the
    # ear is chosen per participant in Adım 8; the database records the ear
    # that was actually used.  `both` tests both ears in turn and doubles the
    # module (EK_GIN §"Kulak Seçimi" — the danışman's decision).
    ear_selection: good_ear            # good_ear | fixed | both
    response_key: space
    # Which press counts as a response to which gap, in ms from the gap onset.
    # Fixed before data collection on purpose (§F): choosing it afterwards means
    # choosing the hit and false-alarm rates after seeing them.  The upper bound
    # has to stay under min_gap_separation_s, or a press would belong to two
    # gaps at once; the prepared set's tightest spacing is 1.029 s.
    # EK_GIN leaves the number to the danışman — this is a starting point.
    response_window_ms: [100, 900]
    # Fixation before the first segment.
    lead_in_s: 1.0
    threshold_criterion: 4_of_6        # shortest gap detected ≥4 of 6 times

speaker_selection:
  strategy: fixed      # fixed | balanced | random
  fixed_id: 1

cross_hearing_check:
  enabled: true
  n_trials: 20
  # Tespit tonu — oddball standardıyla aynı, tek hazırlanmış ton ikisine de
  # hizmet etsin. SSD katılımcısının SAĞIR kulağına lateralize edilir.
  tone_hz: 1000
  # Denemelerin ~yarısı sessiz (catch). Catch'te basma yanlış alarmdır; catch
  # olmadan her denemede basan biri kusursuz tespit ediyormuş gibi görünürdü.
  catch_ratio: 0.5
  # Ton başlangıcından sonra bu aralıkta gelen basım tespit sayılır.
  response_window_ms: [100, 1500]
  response_key: space
  fixation_duration_ms: 800
  post_response_ms: 300

# ---- Oturum öncesi kontrol (python -m mcgurk.checklist, steps.md §C Adım 8) ----
# Operatörün her data_collection oturumu öncesi çalıştıracağı YEŞİL/KIRMIZI
# kontrolün eşikleri. Koda gömülmez (§A.9): haftalık kalibre eden bir merkez ile
# aylık kalibre eden bir merkez KIRMIZI çizgisini farklı yere koyar.
checklist:
  # Bundan eski bir kalibrasyon KIRMIZI verir.
  calibration_max_age_days: 30
  # data/ diskinde bundan az boş alan KIRMIZI verir.
  min_free_disk_mb: 500

# ---- Stimulus preparation (tools/prepare_stimuli.py, Adım 2) ----
# Offline only (§A.12): nothing below is read during a trial.  It lives in this
# file rather than a separate one because the prepared set and the design have
# to be checked against each other — a token in av_pairs with no recording is a
# config error, and the schema now says so at load time.
stimulus_prep:
  # Seeds the speech-shaped noise, the noise instances and the GIN gap
  # placement.  Changing it produces a different (equally valid) stimulus set;
  # keeping it fixed means the set can be rebuilt byte-identically.
  seed: 20260726

  # The id↔folder mapping modules.*.speaker_id refers to.  Only the three
  # congruent recordings of each speaker are used as sources: they are the
  # natural takes.  The six incongruent mp4s are an older re-mux of the same
  # tokens and are ignored.
  speakers:
    - {id: 1, source: assets/female_speaker_1}
    - {id: 2, source: assets/male_speaker_1}
  tokens: [ba, da, ga]

  video:
    # 29.97 → 30.  At 60 Hz the source needs 2.002 refreshes per frame, which
    # repeats a frame roughly once a second.  A 2.58 s clip has 77 frames and
    # keeps all 77 after the conversion — only the timestamps move, by at most
    # 2.6 ms at the end of the clip.  QC fails if a frame is added or dropped.
    target_fps: 30
    crf: 16          # visually lossless; the sources are already AAC/H.264
    all_intra: true

  audio:
    # The sources are 44.1 kHz AAC, so 24 bits add no source precision.  They
    # keep normalisation and noise mixing from stacking quantisation noise;
    # the manifest records what the source actually was.
    bit_depth: 24
    target_level_dbfs: -23.0
    active_speech_threshold_db: 30.0
    # Alignment trims up to ~250 ms off the front of some tokens, so those
    # files would otherwise begin in the middle of the recording's hiss while
    # the others begin in digital silence — an audible step, and an
    # inconsistent one between trials.  Far below the shortest lead-in
    # (~590 ms after alignment), so it can never touch the speech.
    edge_ramp_ms: 10.0

  burst:
    threshold_db: 12.0
    min_duration_ms: 10.0
    alignment_tolerance_ms: 5.0

  noise:
    type: speech_shaped        # from the corpus LTAS, not white noise
    # Distinct noise waveforms per cell.  They are meant to sound identical —
    # speech-shaped noise is stationary — but a repeated *waveform* can be
    # learned across the 10 repetitions of a cell, and these are not repeated.
    instances: 3
    ltas_tolerance_db: 3.0
    # Fade on the noise mixed into a speech token.  50 ms made the noise
    # arrive rather than start.  Bounded above by the token's own lead-in:
    # the fade has to finish before the speech does, or the early part of the
    # token would sit at a higher SNR than the nominal one.  The shortest
    # lead-in in this corpus is ~740 ms (speaker 2, /ga/), and preparation
    # fails rather than guesses if a future recording is tighter than that.
    ramp_ms: 250.0

  tones:
    # The oddball tones (Adım 7).  Frequency, duration and ramp are the design
    # and live under modules.oddball; only the written level is here.  Same
    # value as the speech tokens so one calibration governs both — a pure tone
    # at equal RMS is heard as somewhat louder than speech, which is acceptable
    # for a control task and is what the calibration trim then sets in SPL.
    level_dbfs: -23.0

  gin:
    gap_ramp_ms: 1.0
    # Segment edges, not gap edges.  A six-second noise burst reaching full
    # level in 50 ms arrives rather than starts.  Must not exceed
    # modules.gin.min_gap_separation_s, or a gap could land inside the fade
    # and be quieter than the others — the schema checks this.
    segment_ramp_ms: 200.0
    # Musiek et al. (2005) use broadband noise; the upper edge is bounded so
    # the stimulus does not depend on the headphone response above 8 kHz.
    bandwidth_hz: [100.0, 8000.0]
